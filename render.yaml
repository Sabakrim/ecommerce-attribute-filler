services:
  - type: web
    name: ecommerce-attribute-filler
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: MAX_EXCEL_MB
        value: 20
      - key: MAX_PDF_MB
        value: 50
